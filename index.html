<!DOCTYPE html>
<html lang="tr" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Game5</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game5">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body style="background:#000">

<div id="game-root">
  <!-- Unity Main Camera render target (SpriteRenderers / world) -->
  <canvas id="world"></canvas>

  <!-- Unity Screen-Space-Overlay Canvases (RectTransform verisinden kuruluyor) -->
  <div id="canvas-layer">
    <div id="MainMenuCanvas" class="unity-canvas"></div>
    <div id="GameCanvas" class="unity-canvas"></div>
  </div>
</div>

<!-- tam ekrandan cikilirsa geri donmek icin kose tusu -->
<button id="fs-btn" title="Tam ekran" aria-label="Tam ekran">&#9974;</button>

<!-- acilis ekrani: tek tus, oyunu baslatir + tam ekrana alir -->
<div id="start-gate">
  <div class="gate-inner">
    <img id="gate-icon" src="assets/icons/icon-512.png" alt="">
    <h1>GAME5</h1>
    <button id="start-btn">OYUNU BA&#350;LAT</button>
    <p id="start-hint">Tam ekranda a&#231;&#305;l&#305;r &#183; telefonu yan tut</p>
  </div>
</div>

<!-- telefon dik tutulunca -->
<div id="rotate-gate">
  <div class="rotate-inner">
    <div class="phone"></div>
    <p>Telefonu yan &#231;evir</p>
    <span>Rotate your device</span>
  </div>
</div>

<div id="boot">Y&#252;kleniyor&hellip;</div>

<!-- Unity sahnesinden cikarilan veri (JS olarak, file:// icin de calisir) -->
<script src="assets/data/sprites.data.js"></script>
<script src="assets/data/config.data.js"></script>
<script src="assets/data/components.data.js"></script>
<script src="assets/data/world.data.js"></script>
<script src="assets/data/spinners.data.js"></script>
<script src="assets/data/ui.data.js"></script>

<!-- motor -->
<script src="js/unity.js"></script>
<script src="js/save.js"></script>
<script src="js/physics2d.js"></script>
<script src="js/fx.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/bird.js"></script>
<script src="js/ui.js"></script>
<script src="js/hud.js"></script>
<script src="js/managers.js"></script>
<script src="script.js"></script>

<!-- acilis ekrani -->
<script src="js/start.js"></script>
<script>Boot.init();</script>
</body>
</html>
